name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate module and chapter ownership
        run: python scripts/validate_repository.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate dependency-free offline animation
        run: python visuals/agent-system-journey/tests/check_asset_offline.py